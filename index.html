<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GIMC Intelligence OS | 灵犀 AI 陪伴智能体</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts: Inter & Noto Sans SC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- 引入 Lucide 图标库 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-start: #5b52f6;
            --bg-mid: #8178f8;
            --bg-end: #b7b3fc;
            --logo-scale: 1;
            --lingxi-color: #ffffff;
            --lingxi-glow: rgba(255, 255, 255, 0.28);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #050508;
        }

        #bg-gradient-layer {
            position: fixed;
            inset: 0;
            background: linear-gradient(125deg, var(--bg-start) 0%, var(--bg-mid) 52%, var(--bg-end) 100%);
            opacity: 0;
            transition: opacity 2.6s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 1;
        }

        #bg-gradient-layer.revealed {
            opacity: 1;
        }

        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 2;
            opacity: 0.32;
            mix-blend-mode: screen;
        }

        #stage {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 4vh;
        }

        #lingxi-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            filter: blur(28px);
            transform: scale(0.78) translateY(16px);
            transition: 
                opacity 1.6s cubic-bezier(0.16, 1, 0.3, 1),
                filter 1.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, filter, opacity;
        }

        #lingxi-wrapper.awakened {
            opacity: 1;
            filter: blur(0px);
        }

        /* 3D 空间转身容器 */
        #lingxi-3d-turner {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            will-change: transform;
        }

        @keyframes turn3DSkill {
            0% {
                transform: perspective(900px) rotateY(0deg) scale(1);
            }
            42% {
                transform: perspective(900px) rotateY(90deg) scale(0.86);
            }
            58% {
                transform: perspective(900px) rotateY(270deg) scale(0.86);
            }
            100% {
                transform: perspective(900px) rotateY(360deg) scale(1);
            }
        }

        .turn-3d-active {
            animation: turn3DSkill 0.85s cubic-bezier(0.34, 1.36, 0.64, 1) forwards;
        }

        /* 科技小圆点飞洒微粒 */
        .tech-dot-particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 32;
            will-change: transform, opacity;
            animation: techDotBurst 1.05s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes techDotBurst {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
            70% {
                opacity: 0.9;
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.15);
            }
        }

        #lingxi-glow-ring {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.72) 0%, rgba(190,185,255,0.22) 48%, rgba(255,255,255,0) 72%);
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
            transition: opacity 0.8s ease;
        }

        @keyframes premiumBreatheGlow {
            0%, 100% {
                opacity: 0.25;
                transform: scale(0.9);
                filter: blur(16px);
            }
            50% {
                opacity: 0.75;
                transform: scale(1.25);
                filter: blur(24px);
            }
        }

        .glow-active {
            animation: premiumBreatheGlow 3.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }

        #lingxi-svg {
            width: calc(260px * var(--logo-scale));
            height: calc(260px * var(--logo-scale));
            overflow: visible;
            transition: width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), height 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #lingxi-svg.svg-glow-active {
            animation: svgDropShadowPulse 3.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }

        @keyframes svgDropShadowPulse {
            0%, 100% {
                filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.35)) drop-shadow(0 0 16px rgba(165, 160, 255, 0.25));
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 40px rgba(255, 255, 255, 0.7));
            }
        }

        #eyes-master-group {
            opacity: 0;
            transform: scale(0.15);
            transform-origin: 215px 215px;
            transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #eyes-master-group.eyes-born {
            opacity: 1;
            transform: scale(1);
        }

        #dianjing-burst {
            opacity: 0;
            transform: scale(0.3);
            transform-origin: 215px 215px;
            pointer-events: none;
        }

        @keyframes burstFlash {
            0% { opacity: 0; transform: scale(0.2) rotate(0deg); }
            35% { opacity: 1; transform: scale(1.25) rotate(25deg); }
            100% { opacity: 0; transform: scale(1.85) rotate(45deg); }
        }

        .burst-animate {
            animation: burstFlash 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        #bubble-viewport {
            position: fixed;
            bottom: 108px;
            left: 50%;
            transform: translateX(-50%);
            width: min(90vw, 560px);
            height: 150px;
            z-index: 25;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.45) 22%, black 52%, black 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.45) 22%, black 52%, black 100%);
        }

        #bubble-track {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 8px 12px 12px;
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .chat-bubble {
            position: relative;
            max-width: 92%;
            padding: 13px 22px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.34);
            box-shadow: 0 10px 30px rgba(38, 32, 130, 0.16);
            color: #ffffff;
            font-size: clamp(14px, 1.65vw, 17px);
            line-height: 1.6;
            letter-spacing: 0.02em;
            text-align: center;
            transform-origin: bottom center;
            animation: bubbleFloatIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transition: opacity 0.4s ease, transform 0.4s ease, filter 0.4s ease;
        }

        .chat-bubble.history {
            opacity: 0.42;
            transform: scale(0.91);
            filter: blur(0.6px);
        }

        .chat-bubble.active {
            opacity: 1;
            background: rgba(255, 255, 255, 0.24);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 14px 36px rgba(45, 38, 150, 0.24), inset 0 0 16px rgba(255, 255, 255, 0.15);
        }

        @keyframes bubbleFloatIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.88); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        #brand-footer {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.92);
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.06em;
            z-index: 15;
            opacity: 0;
            transition: opacity 2.2s ease 0.6s;
            pointer-events: none;
            white-space: nowrap;
        }

        #brand-footer.visible { opacity: 1; }

        .wave-bar {
            width: 3px;
            height: 10px;
            background-color: #fff;
            border-radius: 99px;
            animation: soundWave 1s ease-in-out infinite;
        }
        .wave-bar:nth-child(2) { animation-delay: 0.15s; height: 16px; }
        .wave-bar:nth-child(3) { animation-delay: 0.3s; height: 12px; }
        .wave-bar:nth-child(4) { animation-delay: 0.45s; height: 18px; }

        @keyframes soundWave {
            0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
            50% { transform: scaleY(1.1); opacity: 1; }
        }

        #control-drawer {
            position: fixed;
            top: 20px;
            right: 20px;
            bottom: 20px;
            width: 360px;
            max-width: calc(100vw - 40px);
            background: rgba(18, 18, 28, 0.76);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.38);
            z-index: 50;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            transform: translateX(calc(100% + 32px));
            transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #control-drawer.open { transform: translateX(0); }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 99px;
        }

        .touch-ripple {
            position: fixed;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.85);
            background: radial-gradient(circle, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            animation: rippleExpand 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 30;
        }

        @keyframes rippleExpand {
            0% { width: 10px; height: 10px; opacity: 1; transform: translate(-50%, -50%) scale(0.2); }
            100% { width: 380px; height: 380px; opacity: 0; transform: translate(-50%, -50%) scale(1.4); }
        }

        /* 聆听感知光环动效（纯CSS平滑呼吸扩散） */
        @keyframes listenHaloPulse {
            0%, 100% { transform: scale(0.96); opacity: 0.35; }
            50% { transform: scale(1.12); opacity: 0.85; }
        }

        .listening-active-ring {
            animation: listenHaloPulse 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* 思考星轨缓慢旋转（优雅低速，无抖动） */
        @keyframes thinkingOrbitSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .thinking-orbit-active {
            opacity: 1 !important;
            animation: thinkingOrbitSpin 4.5s linear infinite;
        }
    </style>
</head>
<body>

    <div id="bg-gradient-layer"></div>

    <div class="ambient-orb w-[500px] h-[500px] bg-indigo-400 -top-32 -left-32"></div>
    <div class="ambient-orb w-[420px] h-[420px] bg-purple-300 -bottom-24 -right-24"></div>

    <header class="fixed top-5 left-6 right-6 z-40 flex items-center justify-between pointer-events-none">
        <div id="status-badge" class="pointer-events-auto flex items-center gap-3 px-4 py-2 rounded-full bg-white/15 backdrop-blur-md border border-white/25 text-white text-xs sm:text-sm shadow-lg transition-all duration-500 opacity-0">
            <div id="voice-wave" class="flex items-center gap-1 h-4">
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
            </div>
            <span id="status-text" class="font-medium tracking-wide">灵犀陪伴中...随时对我说“灵犀灵犀”唤醒</span>
            <button id="quick-action-btn" class="ml-1 px-3 py-1 rounded-full bg-white text-indigo-600 font-semibold text-xs hover:bg-indigo-50 active:scale-95 transition-all shadow-sm">
                唤醒灵犀
            </button>
        </div>

        <button id="toggle-drawer-btn" aria-label="打开参数设置面板" class="pointer-events-auto flex items-center gap-2 px-4 py-2.5 rounded-full bg-white/15 hover:bg-white/25 active:scale-95 backdrop-blur-md border border-white/25 text-white text-xs sm:text-sm font-medium shadow-lg transition-all duration-300">
            <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
            <span class="hidden sm:inline">灵犀控制台</span>
        </button>
    </header>

    <main id="stage">
        <div id="lingxi-wrapper" title="点击唤醒或触屏点睛">
            <div id="lingxi-3d-turner">
                <div id="lingxi-glow-ring"></div>

                <!-- 100% 还原上传的 442.6 x 442.6 官方精准矢量坐标系（纯矢量双层柔光，彻底消除滤镜矩形框） -->
                <svg id="lingxi-svg" viewBox="60 60 322.6 322.6" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g id="lingxi-body-group" style="transform-origin: 221.3px 221.3px;">
                        <!-- G 轮廓底部圆弧 (来自上传文件) -->
                        <path id="stroke-smile-arc"
                              d="M129.43,221.3a91.87,91.87,0,0,0,183.74,0"
                              stroke="var(--lingxi-color)"
                              stroke-width="22"
                              stroke-linecap="round"
                              stroke-linejoin="round" />

                        <!-- G 轮廓顶部圆弧 (来自上传文件) -->
                        <path id="stroke-top-arc"
                              d="M263.27,129.43h-42a91.89,91.89,0,0,0-84.08,54.8"
                              stroke="var(--lingxi-color)"
                              stroke-width="22"
                              stroke-linecap="round"
                              stroke-linejoin="round" />

                        <!-- G 轮廓右侧横杠 (来自上传文件) -->
                        <path id="stroke-right-bar"
                              d="M335.6,227.19a63.35,63.35,0,0,0-44.88-9.35"
                              stroke="var(--lingxi-color)"
                              stroke-width="22"
                              stroke-linecap="round"
                              stroke-linejoin="round" />

                        <!-- 辅助动效 1：聆听用户说话时的感知同心光环 -->
                        <circle id="listening-pulse-circle"
                                cx="221.3" cy="221.3" r="118"
                                stroke="var(--lingxi-color)"
                                stroke-opacity="0.45"
                                stroke-width="2.5"
                                stroke-dasharray="6 10"
                                opacity="0"
                                style="transform-origin: 221.3px 221.3px; transition: opacity 0.35s ease;" />

                        <!-- 辅助动效 2：智能思考时的极简双星轨光点 -->
                        <g id="thinking-orbit-group" opacity="0" style="transform-origin: 221.3px 221.3px; transition: opacity 0.3s ease;">
                            <circle cx="221.3" cy="96" r="5" fill="var(--lingxi-color)" opacity="0.95" />
                            <circle cx="221.3" cy="346.6" r="3.5" fill="var(--lingxi-color)" opacity="0.6" />
                        </g>

                        <!-- 点睛星芒爆发特效 -->
                        <g id="dianjing-burst">
                            <circle cx="221.3" cy="215" r="56" stroke="var(--lingxi-color)" stroke-width="3" stroke-dasharray="10 14" opacity="0.85" />
                            <path d="M221.3 142 L221.3 158 M221.3 272 L221.3 288 M148.3 215 L164.3 215 M278.3 215 L294.3 215" stroke="var(--lingxi-color)" stroke-width="4" stroke-linecap="round" />
                        </g>

                        <!-- 灵犀双眼图层：纯矢量双层贝塞尔路径（底层矢量柔光 + 顶层实心矢量，零矩形边界） -->
                        <g id="eyes-master-group">
                            <g id="eyes-gaze-layer">
                                <!-- 底层纯矢量柔光光晕路径 -->
                                <path id="eye-left-glow"
                                      d="M198.52,178.54 C191.0,188.0 185.5,204.0 182.96,234.11"
                                      stroke="var(--lingxi-glow)"
                                      stroke-width="32"
                                      stroke-linecap="round"
                                      stroke-linejoin="round" />
                                <path id="eye-right-glow"
                                      d="M241.55,189.11 C234.5,202.0 230.0,218.0 228.22,238.33"
                                      stroke="var(--lingxi-glow)"
                                      stroke-width="32"
                                      stroke-linecap="round"
                                      stroke-linejoin="round" />

                                <!-- 顶层实心锐利矢量路径 -->
                                <path id="eye-left-path"
                                      d="M198.52,178.54 C191.0,188.0 185.5,204.0 182.96,234.11"
                                      stroke="var(--lingxi-color)"
                                      stroke-width="22"
                                      stroke-linecap="round"
                                      stroke-linejoin="round" />
                                <path id="eye-right-path"
                                      d="M241.55,189.11 C234.5,202.0 230.0,218.0 228.22,238.33"
                                      stroke="var(--lingxi-color)"
                                      stroke-width="22"
                                      stroke-linecap="round"
                                      stroke-linejoin="round" />
                            </g>
                        </g>
                    </g>
                </svg>
            </div>
        </div>
    </main>

    <!-- 实时听觉识别反馈胶囊 & 快捷对话输入框 -->
    <div id="live-transcript-pill" class="fixed top-20 left-1/2 -translate-x-1/2 z-30 px-4 py-1.5 rounded-full bg-black/35 backdrop-blur-md border border-white/20 text-white/90 text-xs flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span id="live-transcript-text">正在聆听...</span>
    </div>

    <div id="bubble-viewport" aria-live="polite">
        <div id="bubble-track"></div>
    </div>

    <!-- 底部陪伴对话输入栏（支持语音 + 文字双通道无障碍交互） -->
    <div id="companion-chat-bar" class="fixed bottom-16 left-1/2 -translate-x-1/2 z-30 w-[min(92vw,460px)] flex items-center gap-2 px-3 py-2 rounded-full bg-white/15 backdrop-blur-xl border border-white/25 shadow-2xl transition-all duration-500 opacity-0 pointer-events-none">
        <button id="mic-toggle-btn" title="点击开启/重连麦克风" class="w-9 h-9 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center text-white shrink-0 transition active:scale-90">
            <i data-lucide="mic" class="w-4 h-4"></i>
        </button>
        <input id="companion-text-input" type="text" placeholder="说“灵犀灵犀”或直接输入想聊的话..." class="flex-1 bg-transparent text-white placeholder-white/60 text-xs sm:text-sm focus:outline-none px-1">
        <button id="companion-send-btn" class="px-4 py-1.5 rounded-full bg-white text-indigo-600 font-semibold text-xs hover:bg-indigo-50 active:scale-95 transition shrink-0 shadow">
            发送
        </button>
    </div>

    <footer id="brand-footer">GIMC Intelligence OS · 灵犀陪伴 AI</footer>

    <aside id="control-drawer" aria-label="灵犀参数控制面板">
        <div class="flex items-center justify-between px-6 py-5 border-b border-white/10">
            <div class="flex items-center gap-2.5">
                <span class="w-2.5 h-2.5 rounded-full bg-indigo-400 animate-pulse"></span>
                <h2 class="text-sm font-semibold tracking-wider uppercase text-white/95">灵犀控制台 · 高级陪伴</h2>
            </div>
            <button id="close-drawer-btn" class="p-1.5 rounded-full hover:bg-white/10 text-white/70 hover:text-white transition-colors">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto custom-scroll px-6 py-5 space-y-6 text-xs">
            <section class="space-y-2.5">
                <label class="block text-[11px] font-medium uppercase tracking-wider text-white/50">阶段流程演示</label>

        // 分配并锁定不同声线对应的系统语音（用于离线/极速兜底时也能明显区分音色）

            if (!('speechSynthesis' in window)) return null;

            if (!voices || voices.length === 0) return null;
            const zhVoices = voices.filter(v => v.lang && v.lang.toLowerCase().includes('zh'));
            const pool = zhVoices.length > 0 ? zhVoices : voices;

            const findMatch = (regex, fallbackIdx) =>

            AppState.profileSystemVoices = {
                sweet:   findMatch(/xiaoxiao|yaoyao|female|女/i, 0),
                playful: findMatch(/xiaoyi|mei-jia|sin-ji|tingting/i, 1),
                gentle:  findMatch(/tingting|huihui|zhiyu|yunxi/i, 2),
                crisp:   findMatch(/kangkang|yunyang|yunjian|male/i, 3)
            };
            AppState.cachedZhVoice = AppState.profileSystemVoices[AppState.voiceProfile] || pool[0];
            return AppState.cachedZhVoice;

        // Web Audio 科技音效与动感走秀/发布会 BGM 合成器
        function ensureAudioContext() {
            if (!AppState.audioCtx) {

                    AppState.bgmMasterGain.connect(AppState.audioCtx.destination);
                }
            }
            if (AppState.audioCtx && AppState.audioCtx.state === 'suspended') {
                AppState.audioCtx.resume().catch(() => {});
            }
            return AppState.audioCtx;
        }

        function playChimeSound(type = 'wake') {
            const ctx = ensureAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;

            if (type === 'wake') {
                [587.33, 880, 1174.66].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.06);
                    gain.gain.setValueAtTime(0.001, now + i * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.14, now + i * 0.06 + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.06 + 0.35);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + i * 0.06);
                    osc.stop(now + i * 0.06 + 0.38);
                });
            } else if (type === 'dianjing' || type === 'transform') {
                [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.045);
                    gain.gain.setValueAtTime(0.001, now + i * 0.045);
                    gain.gain.exponentialRampToValueAtTime(0.18, now + i * 0.045 + 0.025);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.045 + 0.45);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + i * 0.045);
                    osc.stop(now + i * 0.045 + 0.48);
                });
            } else if (type === 'yawn' || type === 'sigh') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(type === 'yawn' ? 420 : 360, now);
                osc.frequency.exponentialRampToValueAtTime(210, now + 0.65);
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.exponentialRampToValueAtTime(0.12, now + 0.15);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.72);
            }
        }

        function setBgm(type) {
            AppState.bgmType = type;
            if (AppState.bgmInterval) {
                clearInterval(AppState.bgmInterval);
                AppState.bgmInterval = null;
            }
            if (type === 'none') return;

            const ctx = ensureAudioContext();
            if (!ctx || !AppState.bgmMasterGain) return;

            let step = 0;
            const patterns = {
                runway: { bpmMs: 240, bass: [110, 0, 110, 130.81, 146.83, 0, 130.81, 98], lead: [440, 523.25, 659.25, 587.33, 523.25, 440, 392, 493.88] },
                launch: { bpmMs: 220, bass: [130.81, 130.81, 164.81, 196, 174.61, 174.61, 146.83, 196], lead: [523.25, 659.25, 783.99, 1046.5, 880, 783.99, 659.25, 783.99] },
                cyber:  { bpmMs: 200, bass: [98, 98, 196, 98, 116.54, 116.54, 233.08, 130.81], lead: [392, 466.16, 587.33, 783.99, 698.46, 587.33, 466.16, 523.25] }
            };
            const cfg = patterns[type] || patterns.runway;

            AppState.bgmInterval = setInterval(() => {
                if (AppState.bgmType === 'none' || !AppState.audioCtx) return;
                if (AppState.audioCtx.state === 'suspended') {
                    AppState.audioCtx.resume().catch(() => {});
                }
                const now = AppState.audioCtx.currentTime;
                const idx = step % 8;

                // 强劲底鼓 Kick
                if (idx % 2 === 0) {
                    const kick = AppState.audioCtx.createOscillator();
                    const kGain = AppState.audioCtx.createGain();
                    kick.type = 'sine';
                    kick.frequency.setValueAtTime(135, now);
                    kick.frequency.exponentialRampToValueAtTime(38, now + 0.14);
                    kGain.gain.setValueAtTime(0.24, now);
                    kGain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                    kick.connect(kGain);
                    kGain.connect(AppState.bgmMasterGain);
                    kick.start(now);
                    kick.stop(now + 0.17);
                }

                // 贝斯低音线
                const bassFreq = cfg.bass[idx];
                if (bassFreq > 0) {
                    const bass = AppState.audioCtx.createOscillator();
                    const bGain = AppState.audioCtx.createGain();
                    bass.type = 'triangle';
                    bass.frequency.setValueAtTime(bassFreq, now);
                    bGain.gain.setValueAtTime(0.13, now);
                    bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
                    bass.connect(bGain);
                    bGain.connect(AppState.bgmMasterGain);
                    bass.start(now);
                    bass.stop(now + 0.2);
                }

                // 科技感合成器主旋律
                const leadFreq = cfg.lead[idx];
                if (leadFreq > 0 && (idx % 2 === 1 || type === 'cyber')) {
                    const lead = AppState.audioCtx.createOscillator();
                    const lGain = AppState.audioCtx.createGain();
                    lead.type = 'sine';
                    lead.frequency.setValueAtTime(leadFreq, now);
                    lGain.gain.setValueAtTime(0.075, now);
                    lGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                    lead.connect(lGain);
                    lGain.connect(AppState.bgmMasterGain);
                    lead.start(now);
                    lead.stop(now + 0.19);
                }

                step++;
            }, cfg.bpmMs);
        }

        // 严格单通道互斥语音终止器（同时中止神经网络音频与浏览器语音，彻底消除声音重叠）

        // Base64 转 ArrayBuffer 工具
        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // PCM16 转 WAV 音频流（用于神经网络真人语音合成播放）
        function pcm16ToWavBlob(pcmBuffer, sampleRate = 24000) {
            const numChannels = 1;
            const bitsPerSample = 16;
            const byteRate = (sampleRate * numChannels * bitsPerSample) / 8;
            const blockAlign = (numChannels * bitsPerSample) / 8;
            const dataSize = pcmBuffer.byteLength;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) {
                    view.setUint8(offset + i, str.charCodeAt(i));
                }
            };

            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);
            writeStr(36, 'data');
            view.setUint32(40, dataSize, true);

            new Uint8Array(buffer, 44).set(new Uint8Array(pcmBuffer));
            return new Blob([buffer], { type: 'audio/wav' });
        }

        // 智能语速与自然呼吸停顿分析器
        function analyzeSpeechCadence(text, profileKey) {
            const profile = VoiceProfiles[profileKey] || VoiceProfiles.sweet;
            let rate = profile.rate;
            let pitch = profile.pitch;
            let pauseMs = 180;

            if (/[！!]{1,}|太棒|哇|哈哈|太开心|终于/.test(text)) {
                rate *= 1.06;
                pitch *= 1.04;
                pauseMs = 150;
            } else if (/[？?]$/.test(text)) {
                pitch *= 1.05;
                pauseMs = 220;
            } else if (/……|\.\.\.|呵欠|哈欠|困|失落|孤单|呜/.test(text)) {
                rate *= 0.88;
                pitch *= 0.94;
                pauseMs = 340;
            } else if (text.length > 26) {
                rate *= 1.04;
                pauseMs = 140;
            }
            return { rate, pitch, pauseMs };
        }

        // 预加载真人级神经网络语音合成
        async function fetchNeuralTtsUrl(text, profileKey) {
            const cacheKey = `${profileKey}::${text}`;
            if (AppState.ttsAudioCache.has(cacheKey)) {
                return AppState.ttsAudioCache.get(cacheKey);
            }
            const profile = VoiceProfiles[profileKey] || VoiceProfiles.sweet;
            const apiKey = "";
            if (!apiKey) return null;

            try {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 1600);
                const resp = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        signal: controller.signal,
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `${profile.styleDirective}：${text}` }] }],
                            generationConfig: {
                                responseModalities: ["AUDIO"],
                                speechConfig: {
                                    voiceConfig: {
                                        prebuiltVoiceConfig: { voiceName: profile.geminiVoice }
                                    }
                                }
                            }
                        })
                    }
                );
                clearTimeout(timer);
                if (!resp.ok) return null;
                const data = await resp.json();
                const inlineData = data?.candidates?.[0]?.content?.parts?.[0]?.inlineData;
                if (!inlineData?.data) return null;

                const pcmBuf = base64ToArrayBuffer(inlineData.data);
                const wavBlob = pcm16ToWavBlob(pcmBuf, 24000);
                const url = URL.createObjectURL(wavBlob);
                AppState.ttsAudioCache.set(cacheKey, url);
                return url;
            } catch (e) {
                return null;
            }
        }

        // 单句语音播放（优先真人神经网络音频，极速降级系统锁死人声，绝不重叠）
        async function speakSingleUtterance(text, runId) {
            if (runId !== AppState.dialogueRunId) return;
            const profileKey = AppState.voiceProfile;
            const profile = VoiceProfiles[profileKey] || VoiceProfiles.sweet;
            const cadence = analyzeSpeechCadence(text, profileKey);

            AppState.isSpeaking = true;
            setVisualCompanionMode('idle');

            const neuralUrl = await fetchNeuralTtsUrl(text, profileKey);
            if (runId !== AppState.dialogueRunId) return;

            if (neuralUrl) {
                await new Promise((resolve) => {
                    const audio = new Audio(neuralUrl);
                    AppState.currentAudioEl = audio;
                    audio.onended = () => {
                        AppState.currentAudioEl = null;
                        resolve();
                    };
                    audio.onerror = () => {
                        AppState.currentAudioEl = null;
                        resolve();
                    };
                    audio.play().catch(() => resolve());
                });
            } else if ('speechSynthesis' in window) {
                await new Promise((resolve) => {
                    window.speechSynthesis.cancel();
                    const utter = new SpeechSynthesisUtterance(text);
                    const sysVoice = AppState.profileSystemVoices[profileKey] || lockConsistentChineseVoice();
                    if (sysVoice) utter.voice = sysVoice;
                    utter.lang = 'zh-CN';
                    utter.pitch = cadence.pitch;
                    utter.rate = cadence.rate;

                    let finished = false;
                    const done = () => {
                        if (!finished) {
                            finished = true;
                            resolve();
                        }
                    };
                    utter.onend = done;
                    utter.onerror = done;
                    // 安全超时保护（防止某些浏览器 onend 未触发）
                    setTimeout(done, Math.max(1800, text.length * 260));
                    window.speechSynthesis.speak(utter);
                });
            }

            if (runId === AppState.dialogueRunId) {
                await new Promise(r => setTimeout(r, cadence.pauseMs));
            }
        }

        // 严格有序多句对话播放队列（带并行预热，零断句卡顿）
        async function playOrderedDialogueSequence(lines, onComplete = null) {
            stopAllSpeech();
            const runId = AppState.dialogueRunId;
            const cleanLines = lines.map(l => l.trim()).filter(Boolean);
            if (cleanLines.length === 0) return;

            // 并行预热所有句子音频
            cleanLines.forEach(line => fetchNeuralTtsUrl(line, AppState.voiceProfile));

            for (let i = 0; i < cleanLines.length; i++) {
                if (runId !== AppState.dialogueRunId) return;
                pushSpeechBubble(cleanLines[i], false);
                await speakSingleUtterance(cleanLines[i], runId);
            }

            if (runId === AppState.dialogueRunId) {
                AppState.isSpeaking = false;
                if (onComplete) onComplete();
            }
        }

        // 高容错唤醒词检测（支持 灵犀灵犀 / 0707 / 灵机灵机 / 林夕 / 灵溪 / 凌霄 等）
        function hasWakeWord(transcript) {
            if (!transcript) return false;
            const normalized = transcript.replace(/\s+/g, '').toLowerCase();
            if (/ling\s*xi|0707|零七|灵犀|灵机|林夕|灵溪|凌霄|灵西|玲珑|领衔|令箭/.test(normalized)) {
                return true;
            }
            return /(灵|零|林|凌|领|0)[犀七机夕溪霄西7]/i.test(normalized);
        }

        // 高情商多轮陪伴对话大脑（1秒内极速响应 + 0.5秒自然思考停顿）
        async function handleUserConversation(rawText) {
            const text = (rawText || '').trim();
            if (!text) return;
            markUserActivity(true);

            // 若尚未唤醒或点睛，先完成阶段引导
            if (AppState.phase === 'WAITING_WAKE' || AppState.phase === 'BOOTING') {
                triggerWakeUp();

            if (AppState.phase === 'AWAKENED_NO_EYES') {
                triggerDianjing();
                return;

            pushSpeechBubble(text, true);
            setVisualCompanionMode('thinking');
            setExpression('leftUp');

            // 技能指令识别：变换颜色 / 变身
            if (/变色|变换颜色|换个颜色|换装|变身|换皮肤/.test(text)) {
                await new Promise(r => setTimeout(r, 500));
                triggerColorTransformSkill(true);
                return;
            }

            const startTime = performance.now();
            const replyObj = await generateSmartReply(text);
            const elapsed = performance.now() - startTime;
            // 保持至少 0.5 秒自然思考停顿，且总响应不超过 1 秒
            if (elapsed < 500) {
                await new Promise(r => setTimeout(r, 500 - elapsed));
            }

            setExpression(replyObj.emotion || 'normal');
            triggerSingleBounce();
            playOrderedDialogueSequence([replyObj.reply], () => {
                setVisualCompanionMode('listening');
            });
        }

        async function generateSmartReply(userText) {
            const apiKey = "";
            if (apiKey) {
                try {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 450);
                    const resp = await fetch(
                        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            signal: controller.signal,
                            body: JSON.stringify({
                                contents: [{
                                    parts: [{
                                        text: `你是GIMC省广集团的智能陪伴体“灵犀Ai”，性格聪明、调皮可爱、高情商。请用简短自然口语（35字以内）回复用户：“${userText}”。返回JSON格式：{"reply":"回复内容","emotion":"normal|surprised|silly|angry|sad|uncomfortable"}`
                                    }]
                                }],
                                generationConfig: { responseMimeType: "application/json" }
                            })
                        }
                    );
                    clearTimeout(timer);
                    if (resp.ok) {
                        const data = await resp.json();
                        const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (raw) {
                            const parsed = JSON.parse(raw);
                            if (parsed.reply) return parsed;
                        }
                    }
                } catch (e) {}
            }

            // 极速高情商语义引擎兜底（确保 1 秒内毫秒级稳定回应）
            if (/你好|哈喽|嗨|在吗|早上好|下午好|晚上好/.test(userText)) {
                return { reply: '哈喽呀！灵犀随时都在呢，今天有什么新鲜事想和我分享吗？', emotion: 'normal' };
            }
            if (/你是谁|介绍|省广|gimc|杨董/.test(userText)) {
                return { reply: '我是脱胎于 G-I-M-C 的灵犀Ai呀！心有灵犀一点通，专门为你提供超级灵感！', emotion: 'silly' };
            }
            if (/漂亮|可爱|聪明|厉害|棒|喜欢你|爱你/.test(userText)) {
                return { reply: '嘿嘿，被你这么一夸，灵犀的光环都要开心得发亮啦！', emotion: 'normal' };
            }
            if (/累|困|烦|难过|压力|不开心|加班/.test(userText)) {
                return { reply: '摸摸头，辛苦啦！深呼吸放松一下，灵犀一直在这里陪着你充电哦~', emotion: 'sad' };
            }
            if (/生气|讨厌|笨|坏/.test(userText)) {
                return { reply: '哼！灵犀才不笨呢，我可是超聪明的省广智能体，快哄哄我！', emotion: 'angry' };
            }
            if (/创意|方案|灵感|策划|广告/.test(userText)) {
                return { reply: '哇哦，说到创意灵犀可就来精神了！快把你的想法抛给我一起头脑风暴吧！', emotion: 'surprised' };
            }
            const fallbacks = [
                { reply: '收到！这想法听起来超有意思，快再多跟我说说细节嘛~', emotion: 'surprised' },
                { reply: '嗯嗯，灵犀完全听懂啦！有我在，灵感随时在线哦！', emotion: 'normal' },
                { reply: '哈哈，和你聊天真开心，灵犀的智慧能量又涨了一格！', emotion: 'silly' }
            ];
            return fallbacks[Math.floor(Math.random() * fallbacks.length)];
        }

        // 全双工高容错语音识别引擎（“灵犀灵犀”拥有最高抢断权重）
        function initVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                statusText.textContent = '当前浏览器不支持语音，可使用下方输入框对话';
                return;
            }
            if (AppState.recognition) {
                try { AppState.recognition.abort(); } catch (e) {}
            }

            const rec = new SpeechRecognition();
            rec.lang = 'zh-CN';
            rec.continuous = true;
            rec.interimResults = true;
            AppState.recognition = rec;

            rec.onstart = () => {
                AppState.isListeningActive = true;
                micToggleBtn.classList.add('bg-emerald-500/40', 'ring-2', 'ring-emerald-300');
            };

            rec.onresult = (event) => {
                let interim = '';
                let finalStr = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const res = event.results[i];
                    if (res.isFinal) {
                        finalStr += res[0].transcript;
                    } else {
                        interim += res[0].transcript;
                    }
                }

                const heard = (finalStr || interim).trim();
                if (!heard) return;

                liveTranscriptPill.style.opacity = '1';
                liveTranscriptText.textContent = `听到：${heard}`;
                if (AppState.phase === 'ACTIVATED' && !AppState.isSpeaking) {
                    setVisualCompanionMode('listening');
                }

                // 最高权重唤醒检测：即使正在说话/思考也能秒熔断抢入新对话
                if (hasWakeWord(heard)) {
                    liveTranscriptText.textContent = `✨ 唤醒成功：${heard}`;
                    const restQuery = stripWakeWord(heard);

                    if (AppState.phase === 'WAITING_WAKE' || AppState.phase === 'BOOTING') {
                        triggerWakeUp();
                        return;
                    }
                    if (AppState.phase === 'AWAKENED_NO_EYES') {
                        triggerDianjing();
                        return;
                    }

                    if (finalStr) {
                        stopAllSpeech();
                        markUserActivity(true);
                        if (restQuery.length >= 2) {
                            handleUserConversation(restQuery);
                        } else {
                            setExpression('surprised');
                            triggerSingleBounce();
                            playOrderedDialogueSequence(['在呢在呢！灵犀听到啦，请吩咐~'], () => {
                                setExpression('normal');
                                setVisualCompanionMode('listening');
                            });
                        }
                    }
                    return;
                }

                // 已激活状态下，用户说出完整一句话自动进入自由对话
                if (finalStr && AppState.phase === 'ACTIVATED' && !AppState.isSpeaking) {
                    handleUserConversation(finalStr);
                }
            };

            rec.onerror = (e) => {
                if (e.error === 'not-allowed') {
                    AppState.isListeningActive = false;
                    statusText.textContent = '麦克风未授权，可点击屏幕或使用下方输入栏';
                }
            };

            rec.onend = () => {
                if (AppState.isListeningActive) {
                    setTimeout(() => {
                        try { rec.start(); } catch (e) {}
                    }, 180);
                }
            };

            try {
                rec.start();
            } catch (e) {}
        }

        // 60fps 主动画循环：自然呼吸感 + 随机眨眼 + 全向眼球跟随 + 16s打呵欠 + 30s物理惯性游走
        let lastFrameTime = performance.now();
        function animateLoop(now = performance.now()) {
            const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
            lastFrameTime = now;
            const elapsedSec = now / 1000;

            // 1. 矢量表情形变插值
            EyeMorphEngine.update(dt);

            // 2. 自然随机眨眼（仅在点睛激活且非手动锁定表情时触发）
            if (AppState.hasEyes && !AppState.manualExpressionOverride) {
                if (!AppState.isBlinking && elapsedSec >= AppState.nextBlinkTime) {
                    AppState.isBlinking = true;
                    EyeMorphEngine.setTarget('blink');
                    setTimeout(() => {
                        AppState.isBlinking = false;
                        EyeMorphEngine.setTarget(AppState.expression);
                        AppState.nextBlinkTime = (performance.now() / 1000) + 2.6 + Math.random() * 3.2;
                    }, 145);
                }
            }

            // 3. 全向眼球跟随（上下左右平滑椭圆域跟随）
            const targetGazeX = Math.max(-26, Math.min(26, AppState.pointerNormX * 26));
            const targetGazeY = Math.max(-22, Math.min(22, AppState.pointerNormY * 22));
            AppState.currentGazeX += (targetGazeX - AppState.currentGazeX) * Math.min(1, dt * 10);
            AppState.currentGazeY += (targetGazeY - AppState.currentGazeY) * Math.min(1, dt * 10);
            eyesGazeLayer.setAttribute('transform', `translate(${AppState.currentGazeX.toFixed(2)}, ${AppState.currentGazeY.toFixed(2)})`);

            // 4. 优雅缓慢呼吸感 + 弹性回弹（零高频抖动）
            bodyScale.current += (bodyScale.target - bodyScale.current) * Math.min(1, dt * 12);
            const slowBreathe = 1 + Math.sin(elapsedSec * 1.65) * 0.022;
            const speakPulse = AppState.isSpeaking ? (1 + Math.sin(elapsedSec * 5.2) * 0.015) : 1;
            const totalScale = bodyScale.current * slowBreathe * speakPulse;
            bodyGroup.setAttribute('transform', `scale(${totalScale.toFixed(4)})`);

            // 5. 闲置状态机（16秒打呵欠/失落，30秒物理惯性游走）
            if (AppState.phase === 'ACTIVATED' && !AppState.isSpeaking) {
                const idleSec = (Date.now() - AppState.lastInteractionTime) / 1000;
                if (idleSec >= 16 && AppState.idleStage === 0) {
                    AppState.idleStage = 1;
                    triggerIdleYawnOrSad();
                } else if (idleSec >= 30 && AppState.idleStage === 1) {
                    AppState.idleStage = 2;
                    RoamPhysics.active = true;
                    pickNextRoamTarget();
                }
            }

            // 6. 物理惯性游走更新（先快后慢 Ease-Out + 加速惯性侧倾）
            if (RoamPhysics.active || RoamPhysics.progress < 1) {
                if (RoamPhysics.progress < 1) {
                    RoamPhysics.progress = Math.min(1, RoamPhysics.progress + dt / RoamPhysics.duration);
                    // 三次方先快后慢缓动曲线 (Ease-Out Cubic)
                    const t = RoamPhysics.progress;
                    const easeOut = 1 - Math.pow(1 - t, 3);
                    const prevX = RoamPhysics.x;
                    RoamPhysics.x = RoamPhysics.startX + (RoamPhysics.targetX - RoamPhysics.startX) * easeOut;
                    RoamPhysics.y = RoamPhysics.startY + (RoamPhysics.targetY - RoamPhysics.startY) * easeOut;

                    // 瞬时横向速度产生的物理惯性倾斜角
                    const vx = (RoamPhysics.x - prevX) / Math.max(0.008, dt);
                    const targetTilt = Math.max(-11, Math.min(11, -vx * 0.032));
                    RoamPhysics.tiltAngle += (targetTilt - RoamPhysics.tiltAngle) * Math.min(1, dt * 10);
                } else {
                    RoamPhysics.tiltAngle += (0 - RoamPhysics.tiltAngle) * Math.min(1, dt * 8);
                    if (RoamPhysics.active) {
                        RoamPhysics.nextMoveTimer -= dt;
                        if (RoamPhysics.nextMoveTimer <= 0) {
                            pickNextRoamTarget();
                        }
                    }
                }
                lingxiWrapper.style.transform = `translate3d(${RoamPhysics.x.toFixed(1)}px, ${RoamPhysics.y.toFixed(1)}px, 0) skewX(${RoamPhysics.tiltAngle.toFixed(2)}deg) rotate(${(-RoamPhysics.tiltAngle * 0.45).toFixed(2)}deg)`;
            } else if (lingxiWrapper.classList.contains('awakened')) {
                lingxiWrapper.style.transform = 'translate3d(0px, 0px, 0)';
            }

            requestAnimationFrame(animateLoop);
        }

        window.onload = function () {
            animateLoop();
            startBootSequence();
        };
    </script>
</body>
</html>
